name: Annonce et sortie programmées — Monsieur Clergé

# Fusionne la branche d'annonce le 23 novembre 2026 à partir de 15 h (Paris),
# puis la branche de sortie le 30 novembre à partir de 18 h 30 (17 h 30 UTC).
# Les déclenchements cron des Actions peuvent avoir du retard : le premier
# démarre en avance et attend l'heure cible, le second sert de filet de sécurité.

on:
  schedule:
    - cron: "30 13 23 11 *"
    - cron: "20 14 23 11 *"
    - cron: "0 17 30 11 *"
    - cron: "50 17 30 11 *"
  workflow_dispatch:
    inputs:
      etape:
        description: "Étape à vérifier ou publier"
        type: choice
        options:
          - annonce
          - sortie
        default: sortie
      verification:
        description: "Vérifier le candidat et reconstruire main sans publier l'étape"
        type: boolean
        default: true

permissions:
  actions: read
  contents: write
  pages: write

concurrency:
  group: sortie-monsieur-clerge
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Contrôler la date et le mode
        id: mode
        env:
          VERIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.verification }}
          EVENT: ${{ github.event_name }}
          ETAPE: ${{ inputs.etape }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Lancer ce workflow depuis main."; exit 1
          fi
          if [ "$EVENT" = "schedule" ]; then
            case "$SCHEDULE" in
              "30 13 23 11 *"|"20 14 23 11 *") ETAPE=annonce ;;
              "0 17 30 11 *"|"50 17 30 11 *") ETAPE=sortie ;;
              *) echo "::error::Déclenchement inconnu."; exit 1 ;;
            esac
          fi
          case "$ETAPE" in
            annonce)
              jour=2026-11-23
              heure=14:00:00
              branche=annonce-monsieur-clerge
              limite="23 novembre 2026 à 15 h (Paris)"
              ;;
            sortie)
              jour=2026-11-30
              heure=17:30:00
              branche=sortie-monsieur-clerge
              limite="30 novembre 2026 à 18 h 30 (Paris)"
              ;;
            *) echo "::error::Étape inconnue."; exit 1 ;;
          esac
          echo "branche=$branche" >> "$GITHUB_OUTPUT"
          echo "jour=$jour" >> "$GITHUB_OUTPUT"
          echo "etape=$ETAPE" >> "$GITHUB_OUTPUT"
          if [ "$VERIFICATION" = "true" ]; then
            echo "valeur=verification" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = "schedule" ] && [ "$(date -u +%F)" != "$jour" ]; then
            echo "::notice::Ce déclenchement ne correspond pas à la date de l'étape."
            echo "valeur=ignore" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cible=$(date -u -d "$jour $heure" +%s)
          maintenant=$(date -u +%s)
          if [ "$maintenant" -lt "$cible" ]; then
            if [ "$EVENT" != "schedule" ]; then
              echo "::error::Publication interdite avant le $limite."; exit 1
            fi
            sleep $((cible - maintenant))
          fi
          echo "valeur=publication" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.mode.outputs.valeur != 'ignore'
        with:
          ref: main
          fetch-depth: 0

      - name: Préparer la fusion sans la publier
        if: steps.mode.outputs.valeur != 'ignore'
        id: fusion
        env:
          BRANCHE: ${{ steps.mode.outputs.branche }}
        run: |
          echo "main=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git fetch origin "$BRANCHE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "origin/$BRANCHE"
          echo "sortie=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branche=$(git rev-parse "origin/$BRANCHE")" >> "$GITHUB_OUTPUT"

      - name: Tester et construire le candidat
        if: steps.mode.outputs.valeur != 'ignore'
        run: |
          python3 -m unittest discover -s _outils -p 'test_*seo.py'
          python3 -m unittest discover -s _outils -p test_oracle.py
          docker run \
            -v ${{ github.workspace }}:/srv/jekyll -v ${{ github.workspace }}/_site:/srv/jekyll/_site \
            jekyll/builder:latest /bin/bash -c "chmod -R 777 /srv/jekyll && jekyll build --future"

      - name: Vérifier les pages rendues
        if: steps.mode.outputs.valeur != 'ignore'
        env:
          MODE: ${{ steps.mode.outputs.valeur }}
          JOUR: ${{ steps.mode.outputs.jour }}
          ETAPE: ${{ steps.mode.outputs.etape }}
        run: |
          if [ "$MODE" = "verification" ]; then
            python3 _outils/controle_seo.py _site --as-of "$JOUR"
          else
            python3 _outils/controle_seo.py _site
          fi
          {
            echo "Mode : $MODE"
            echo "Étape : $ETAPE"
            echo "Main : ${{ steps.fusion.outputs.main }}"
            echo "Candidat : ${{ steps.fusion.outputs.sortie }}"
            echo "Branche : ${{ steps.fusion.outputs.branche }}"
            echo "Run : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > _site/verification-sortie.txt

      - name: Conserver le rendu vérifié
        if: steps.mode.outputs.valeur != 'ignore'
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ steps.mode.outputs.etape }}-monsieur-clerge
          retention-days: 30
          path: |
            _site/**/*.html
            _site/sitemap.xml
            _site/robots.txt
            _site/SECTIONS/actu/clerge-*
            _site/verification-sortie.txt

      - name: Publier la fusion
        if: steps.mode.outputs.valeur == 'publication'
        run: |
          git push origin HEAD:main

      # Un push fait avec GITHUB_TOKEN ne déclenche pas de build Pages :
      # on le demande explicitement, même si une tentative précédente a déjà fusionné.
      # En vérification, seul main (sans la sortie) est reconstruit en ligne.
      - name: Demander le build GitHub Pages
        if: steps.mode.outputs.valeur != 'ignore'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.mode.outputs.valeur == 'verification' && steps.fusion.outputs.main || steps.fusion.outputs.sortie }}
        run: |
          api="repos/${{ github.repository }}"
          precedent=$(gh api "$api/actions/runs?head_sha=$SHA&per_page=10" \
            --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment") | .id] | max // 0')
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
          run=""
          for i in $(seq 1 40); do
            sleep 30
            if [ -z "$run" ]; then
              run=$(gh api "$api/actions/runs?head_sha=$SHA&per_page=10" \
                --jq ".workflow_runs | map(select(.path == \"dynamic/pages/pages-build-deployment\" and .head_sha == \"$SHA\" and .id > $precedent)) | sort_by(.id) | last | .id // empty")
              [ -z "$run" ] && continue
            fi
            # /pages/builds/latest peut décrire un ancien build annulé du même SHA.
            # Suivre le nouveau workflow, qui inclut le déploiement, et pas ce statut.
            etat=$(gh api "$api/actions/runs/$run" --jq '.status + " " + (.conclusion // "")')
            echo "Pages $run : $etat"
            if [ "$etat" = "completed success" ]; then
              echo "Pages : $SHA déployé avec GITHUB_TOKEN. https://github.com/${{ github.repository }}/actions/runs/$run" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$etat" == completed* ]]; then
              echo "::error::Le workflow Pages $run a échoué : $etat"; exit 1
            fi
          done
          echo "::error::Le build Pages attendu n'a pas terminé dans le délai."
          exit 1
