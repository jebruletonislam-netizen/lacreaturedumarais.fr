name: Sortie programmée — Monsieur Clergé

# Fusionne la branche sortie-monsieur-clerge dans main le 30 novembre 2026
# à partir de 18 h, heure de Paris (17 h UTC), puis demande un build GitHub Pages.
# Les déclenchements cron des Actions peuvent avoir du retard : le premier
# démarre en avance et attend 17 h UTC, le second sert de filet de sécurité.

on:
  schedule:
    - cron: "30 16 30 11 *"
    - cron: "20 17 30 11 *"
  workflow_dispatch:
    inputs:
      verification:
        description: "Vérifier la sortie et reconstruire main sans publier le morceau"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write

concurrency:
  group: sortie-monsieur-clerge
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Contrôler la date et le mode
        id: mode
        env:
          VERIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.verification }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Lancer ce workflow depuis main."; exit 1
          fi
          if [ "$VERIFICATION" = "true" ]; then
            echo "valeur=verification" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = "schedule" ] && [ "$(date -u +%F)" != "2026-11-30" ]; then
            echo "::notice::La date de cette sortie est passée."
            echo "valeur=ignore" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cible=$(date -u -d '2026-11-30 17:00:00' +%s)
          maintenant=$(date -u +%s)
          if [ "$maintenant" -lt "$cible" ]; then
            if [ "$EVENT" != "schedule" ]; then
              echo "::error::Publication interdite avant le 30 novembre 2026 à 18 h (Paris)."; exit 1
            fi
            sleep $((cible - maintenant))
          fi
          echo "valeur=publication" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.mode.outputs.valeur != 'ignore'
        with:
          ref: main
          fetch-depth: 0

      - name: Préparer la fusion sans la publier
        if: steps.mode.outputs.valeur != 'ignore'
        id: fusion
        run: |
          echo "main=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git fetch origin sortie-monsieur-clerge
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/sortie-monsieur-clerge
          echo "sortie=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Tester et construire le candidat
        if: steps.mode.outputs.valeur != 'ignore'
        run: |
          python3 -m unittest discover -s _outils -p 'test_*seo.py'
          python3 -m unittest discover -s _outils -p test_oracle.py
          docker run \
            -v ${{ github.workspace }}:/srv/jekyll -v ${{ github.workspace }}/_site:/srv/jekyll/_site \
            jekyll/builder:latest /bin/bash -c "chmod -R 777 /srv/jekyll && jekyll build --future"

      - name: Vérifier les pages rendues
        if: steps.mode.outputs.valeur != 'ignore'
        env:
          MODE: ${{ steps.mode.outputs.valeur }}
        run: |
          if [ "$MODE" = "verification" ]; then
            python3 _outils/controle_seo.py _site --as-of 2026-11-30
          else
            python3 _outils/controle_seo.py _site
          fi
          {
            echo "Mode : $MODE"
            echo "Main : ${{ steps.fusion.outputs.main }}"
            echo "Candidat : ${{ steps.fusion.outputs.sortie }}"
            echo "Branche : $(git rev-parse origin/sortie-monsieur-clerge)"
            echo "Run : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > _site/verification-sortie.txt

      - name: Conserver le rendu vérifié
        if: steps.mode.outputs.valeur != 'ignore'
        uses: actions/upload-artifact@v4
        with:
          name: verification-monsieur-clerge
          retention-days: 30
          path: |
            _site/**/*.html
            _site/sitemap.xml
            _site/robots.txt
            _site/SECTIONS/actu/clerge-*
            _site/verification-sortie.txt

      - name: Publier la fusion
        if: steps.mode.outputs.valeur == 'publication'
        run: |
          git push origin HEAD:main

      # Un push fait avec GITHUB_TOKEN ne déclenche pas de build Pages :
      # on le demande explicitement, même si une tentative précédente a déjà fusionné.
      # En vérification, seul main (sans la sortie) est reconstruit en ligne.
      - name: Demander le build GitHub Pages
        if: steps.mode.outputs.valeur != 'ignore'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.mode.outputs.valeur == 'verification' && steps.fusion.outputs.main || steps.fusion.outputs.sortie }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
          for i in $(seq 1 40); do
            sleep 30
            ligne=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '.commit + " " + .status')
            echo "Build Pages : $ligne"
            if [ "$ligne" = "$SHA built" ]; then
              echo "Pages : $SHA construit avec GITHUB_TOKEN." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$ligne" = "$SHA errored" ]; then
              echo "::error::Le build Pages a échoué."; exit 1
            fi
          done
          echo "::error::Le build Pages attendu n'a pas terminé dans le délai."
          exit 1
