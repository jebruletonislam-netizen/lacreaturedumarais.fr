name: Veille des citations X

on:
  schedule:
    - cron: '17 8 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Vérifier le fil public sans clé
        run: python3 _outils/veille_x.py "$GITHUB_STEP_SUMMARY"
