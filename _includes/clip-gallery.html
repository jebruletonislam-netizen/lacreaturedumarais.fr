<div class="tour-gallery">
  {% for photo in site.data.clip_galleries[page.gallery] %}
  <figure class="ph">
    <a href="/images/{{ photo.file | uri_escape }}" target="_blank" rel="noopener" aria-label="Ouvrir la photo : {{ photo.caption | escape }}">
      <img src="/images/{{ photo.file | uri_escape }}" alt="Photo du tournage de {{ page.clip_title }} — {{ photo.caption | escape }}" loading="lazy">
    </a>
    <figcaption>{{ photo.caption | escape }}</figcaption>
  </figure>
  {% endfor %}
</div>
