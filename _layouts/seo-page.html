<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ page.title | escape }}</title>
  <meta name="description" content="{{ page.description | escape }}">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#000000">
  <link rel="canonical" href="{{ page.canonical_url | default: page.url | prepend: 'https://lacreaturedumarais.fr' }}">
  <link rel="icon" href="/images/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/seo-pages.css">
  <meta property="og:type" content="{% if page.youtube_id %}video.other{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta property="og:url" content="{{ page.canonical_url | default: page.url | prepend: 'https://lacreaturedumarais.fr' }}">
  <meta property="og:site_name" content="La Créature du Marais">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:image" content="{% if page.youtube_id %}https://img.youtube.com/vi/{{ page.youtube_id }}/maxresdefault.jpg{% else %}https://lacreaturedumarais.fr/images/creature.jpg{% endif %}">
  <meta property="og:image:alt" content="{% if page.youtube_id %}Miniature du clip {{ page.clip_title | escape }}{% else %}Tancrède Charon, La Créature du Marais{% endif %}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | escape }}">
  <meta name="twitter:description" content="{{ page.description | escape }}">
  <meta name="twitter:image" content="https://lacreaturedumarais.fr/images/creature.jpg">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "@id": "{{ page.canonical_url | default: page.url | prepend: 'https://lacreaturedumarais.fr' }}#webpage",
    "url": "{{ page.canonical_url | default: page.url | prepend: 'https://lacreaturedumarais.fr' }}",
    "name": {{ page.title | jsonify }},
    "description": {{ page.description | jsonify }},
    "inLanguage": "fr-FR",
    "isPartOf": {"@id": "https://lacreaturedumarais.fr/#website"},
    "about": {"@id": "https://lacreaturedumarais.fr/#artist"}
  }
  </script>
  {% if page.artist_profile %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "@id": "https://lacreaturedumarais.fr/#artist",
    "name": "Tancrède Charon",
    "alternateName": ["La Créature du Marais", "Cul-Pointu"],
    "url": "https://lacreaturedumarais.fr/la-creature-du-marais/",
    "image": "https://lacreaturedumarais.fr/images/creature.jpg",
    "jobTitle": "Artiste musical",
    "homeLocation": {
      "@type": "Place",
      "name": "Rouen, Normandie, France"
    },
    "sameAs": [
      "https://www.youtube.com/@LaCreatureduMarais",
      "https://www.instagram.com/lacreaturedumarais/",
      "https://open.spotify.com/artist/6TyTUlT9oP50a9Wdi4qc7J",
      "https://cul-pointu.bandcamp.com/",
      "https://www.deezer.com/fr/artist/110734722",
      "https://music.apple.com/fr/artist/cul-pointu/1535689871",
      "https://x.com/TancredeCharon",
      "https://www.tiktok.com/@lacreaturedumarais"
    ]
  }
  </script>
  {% endif %}
  {% if page.youtube_id %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoObject",
    "name": {{ page.clip_title | jsonify }},
    "description": {{ page.description | jsonify }},
    "thumbnailUrl": ["https://img.youtube.com/vi/{{ page.youtube_id }}/maxresdefault.jpg"],
    "embedUrl": "https://www.youtube.com/embed/{{ page.youtube_id }}",
    "url": "https://lacreaturedumarais.fr{{ page.url }}",
    "inLanguage": "fr-FR",
    "publisher": {"@type": "Organization", "name": "PUANTEUR PUTRIDE Productions"}
  }
  </script>
  {% endif %}
  {% if page.discography %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "@id": "https://lacreaturedumarais.fr/discographie/#page",
    "url": "https://lacreaturedumarais.fr/discographie/",
    "name": "Discographie de La Créature du Marais",
    "inLanguage": "fr-FR",
    "mainEntity": {
      "@type": "ItemList",
      "itemListOrder": "https://schema.org/ItemListOrderDescending",
      "numberOfItems": 5,
      "itemListElement": [
        {"@type": "ListItem", "position": 1, "item": {"@type": "MusicAlbum", "name": "Jubilé", "url": "https://lacreaturedumarais.fr/jubile.html"}},
        {"@type": "ListItem", "position": 2, "item": {"@type": "MusicAlbum", "name": "Confiteor", "url": "https://lacreaturedumarais.fr/confiteor.html"}},
        {"@type": "ListItem", "position": 3, "item": {"@type": "MusicAlbum", "name": "Omerta434 : Chyren", "url": "https://lacreaturedumarais.fr/omerta434-chyren.html"}},
        {"@type": "ListItem", "position": 4, "item": {"@type": "MusicAlbum", "name": "Omerta434", "url": "https://lacreaturedumarais.fr/omerta434.html"}},
        {"@type": "ListItem", "position": 5, "item": {"@type": "MusicAlbum", "name": "Les Machines Infernales", "url": "https://lacreaturedumarais.fr/les-machines-infernales.html"}}
      ]
    }
  }
  </script>
  {% endif %}
</head>
<body>
  <header class="route-header">
    <div class="route-cre">
      <a class="route-cre-link" href="/" aria-label="La Créature du Marais, accueil">
        <picture>
          <source media="(max-width:899px)" srcset="/images/entete-creature-v3.jpg">
          <img src="/images/entete-creature-v4.jpg" alt="La Créature du Marais">
        </picture>
      </a>
    </div>
    <div class="route-mid">
      <img src="/images/entete-milieu.png" alt="Plateformes">
      <a aria-label="Deezer" href="https://www.deezer.com/fr/artist/110734722" rel="noopener" target="_blank" style="left:15.54%"></a>
      <a aria-label="Apple Musique" href="https://music.apple.com/fr/artist/cul-pointu/1535689871" rel="noopener" target="_blank" style="left:25.69%"></a>
      <a aria-label="Spotify" href="https://open.spotify.com/artist/6TyTUlT9oP50a9Wdi4qc7J" rel="noopener" target="_blank" style="left:36.21%"></a>
      <a aria-label="Instagram" href="https://www.instagram.com/lacreaturedumarais/" rel="noopener" target="_blank" style="left:46.41%"></a>
      <a aria-label="YouTube" href="https://www.youtube.com/@LaCreatureduMarais" rel="noopener" target="_blank" style="left:57.10%"></a>
      <a aria-label="X" href="https://x.com/TancredeCharon" rel="noopener" target="_blank" style="left:67.57%"></a>
      <a aria-label="TikTok" href="https://www.tiktok.com/@lacreaturedumarais" rel="noopener" target="_blank" style="left:77.82%"></a>
    </div>
    <a aria-label="Archives PUANTEUR PUTRIDE Productions" class="route-ppp" href="/#archives">
      <img class="route-ppp-logo" src="/images/logo-ppp-entete.jpg" alt="PUANTEUR PUTRIDE Productions">
    </a>
    <div class="route-mobile-header-socials" aria-label="Réseaux sociaux">
      <a aria-label="Instagram" href="https://www.instagram.com/lacreaturedumarais/" rel="noopener" target="_blank"><img src="/images/icone-instagram.png" alt=""></a>
      <a aria-label="Spotify" href="https://open.spotify.com/artist/6TyTUlT9oP50a9Wdi4qc7J" rel="noopener" target="_blank"><img src="/images/icone-spotify.png" alt=""></a>
      <a aria-label="YouTube" href="https://www.youtube.com/@LaCreatureduMarais" rel="noopener" target="_blank"><img src="/images/icone-youtube.png" alt=""></a>
    </div>
  </header>
  <div class="route-wrap">
    <nav class="route-side-nav" aria-label="Navigation principale">
      <a href="/discographie/" aria-label="Discographie"><span class="route-nav-icon"><svg aria-hidden="true" viewBox="0 0 64 64"><circle cx="32" cy="32" r="25"></circle><circle cx="32" cy="32" r="6"></circle><path d="M32 7v19M32 38v19"></path></svg></span><span class="route-nav-text">DISCOGRAPHIE</span></a>
      <a href="/biographie/" aria-label="Biographie"><span class="route-nav-icon"><svg aria-hidden="true" viewBox="0 0 64 64"><rect height="46" rx="2" width="34" x="15" y="9"></rect><path d="M22 20h20M22 29h20M22 38h15M22 47h12"></path></svg></span><span class="route-nav-text">BIOGRAPHIE</span></a>
      <a href="/videos/" aria-label="Vidéos"><span class="route-nav-icon"><svg aria-hidden="true" viewBox="0 0 64 64"><rect height="32" rx="3" width="48" x="8" y="16"></rect><path d="M26 24l16 8-16 8z"></path></svg></span><span class="route-nav-text">VIDÉOS</span></a>
      <a href="/#nouvelles" aria-label="Nouvelles"><span class="route-nav-icon"><svg aria-hidden="true" viewBox="0 0 64 64"><path d="M18 12h28v40H18z"></path><path d="M24 22h16M24 31h16M24 40h12"></path></svg></span><span class="route-nav-text">NOUVELLES</span></a>
      <a href="/contact/" aria-label="Contact"><span class="route-nav-icon"><svg aria-hidden="true" viewBox="0 0 64 64"><rect height="32" rx="3" width="46" x="9" y="16"></rect><path d="M11 19l21 17 21-17"></path></svg></span><span class="route-nav-text">CONTACT</span></a>
    </nav>
    <main class="route-main">
      <section class="route-content">
        {{ content }}
      </section>
    </main>
  </div>
  <footer class="route-mobile-footer" aria-label="Réseaux sociaux et PUANTEUR PUTRIDE Productions">
    <div class="route-mobile-socials">
      <a aria-label="Deezer" href="https://www.deezer.com/fr/artist/110734722" rel="noopener" target="_blank"><img src="/images/icone-deezer.png" alt=""></a>
      <a aria-label="Apple Musique" href="https://music.apple.com/fr/artist/cul-pointu/1535689871" rel="noopener" target="_blank"><img src="/images/icone-apple-music.png" alt=""></a>
      <a aria-label="Spotify" href="https://open.spotify.com/artist/6TyTUlT9oP50a9Wdi4qc7J" rel="noopener" target="_blank"><img src="/images/icone-spotify.png" alt=""></a>
      <a aria-label="Instagram" href="https://www.instagram.com/lacreaturedumarais/" rel="noopener" target="_blank"><img src="/images/icone-instagram.png" alt=""></a>
      <a aria-label="YouTube" href="https://www.youtube.com/@LaCreatureduMarais" rel="noopener" target="_blank"><img src="/images/icone-youtube.png" alt=""></a>
      <a aria-label="X" href="https://x.com/TancredeCharon" rel="noopener" target="_blank"><img src="/images/icone-x.png" alt=""></a>
      <a aria-label="TikTok" href="https://www.tiktok.com/@lacreaturedumarais" rel="noopener" target="_blank"><img src="/images/icone-tiktok.png" alt=""></a>
    </div>
    <a aria-label="Archives PUANTEUR PUTRIDE Productions" class="route-mobile-ppp" href="/#archives"><img src="/images/logo-ppp-entete.jpg" alt="PUANTEUR PUTRIDE Productions"></a>
  </footer>
  <footer class="route-footer">
    <img class="route-footer-title" src="/images/pied-titre.png" alt="La Créature du Marais — Cul-Pointu">
    <p class="route-footer-copyright">© MMXXVI</p>
  </footer>
  <script src="/lightbox.js"></script>
</body>
</html>
